name: validator 자동 검증 트리거

on:
  pull_request:
    types: [opened]
    branches:
      - main

jobs:
  trigger-validator:
    name: validator 체크리스트 트리거
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: validator 검증 코멘트 게시
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const branch = pr.head.ref;
            const title = pr.title;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: [
                `@github-copilot`,
                ``,
                `## validator 검증 요청`,
                ``,
                `**PR**: ${title}`,
                `**브랜치**: \`${branch}\` → \`main\``,
                ``,
                `아래 체크리스트를 순서대로 **명령어를 실제 실행**하며 수행하고,`,
                `결과를 이 PR에 표 형식으로 코멘트로 보고해주세요.`,
                ``,
                `### 수행 항목`,
                `1. **[1] Protocol 준수** — ExchangeAdapter 4메서드 모두 구현됐는가`,
                `2. **[2] 격리 확인** — DB import, signum-engine 내부 참조 없는가`,
                `3. **[3] 하드코드 금지** — URL/timeout 리터럴, os.getenv 직접 호출 없는가`,
                `4. **[4] 보안** — 시크릿 로그 노출 경로, 입력값 검증 있는가`,
                `5. **[5] API 정확성** — HMAC 서명 순서, MARKET_BUY 구분, ERR-422 처리`,
                `6. **[6] 테스트** — \`pytest -m "not requires_api_key"\` FAILED 0건`,
                ``,
                `### 결과 보고 형식`,
                `\`\`\``,
                `| # | 항목 | 결과 | 근거 |`,
                `|---|------|------|------|`,
                `| 1 | Protocol 준수 | ✅/❌ | |`,
                `| 2 | 격리 확인 | ✅/❌ | |`,
                `| 3 | 하드코드 금지 | ✅/❌ | |`,
                `| 4 | 보안 | ✅/❌ | |`,
                `| 5 | API 정확성 | ✅/❌ | |`,
                `| 6 | 테스트 | ✅/❌ | |`,
                `\`\`\``,
                ``,
                `**종합**: ✅ 전항목 통과 → Approve / ❌ FAIL 항목 → Request Changes`,
              ].join('\n'),
            });
