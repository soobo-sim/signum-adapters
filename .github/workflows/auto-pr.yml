name: Auto PR

on:
  push:
    branches:
      - 'feature/**'

jobs:
  create-pr:
    name: Create PR if not exists
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ github.ref_name }}"
          BASE_BRANCH="main"

          # 이미 PR 존재하면 스킵
          EXISTING=$(gh pr list --head "$BRANCH" --base "$BASE_BRANCH" \
            --json number --jq '.[0].number' 2>/dev/null)
          if [ -n "$EXISTING" ]; then
            echo "PR already exists: #${EXISTING} — skip"
            exit 0
          fi

          # diff 없으면 스킵
          git fetch origin "$BASE_BRANCH" --depth=50 2>/dev/null || true
          DIFF_COUNT=$(git diff "origin/${BASE_BRANCH}..HEAD" --name-only 2>/dev/null | wc -l | tr -d ' ')
          if [ "$DIFF_COUNT" -eq 0 ]; then
            echo "No diff vs $BASE_BRANCH — skip PR"
            exit 0
          fi

          # BRANCH에서 이슈 번호 추출 (feature/gmo-coin-init 등)
          TITLE=$(echo "$BRANCH" | sed 's|feature/||' | sed 's|-| |g')

          gh pr create \
            --title "[feat] ${TITLE}" \
            --body "$(cat .github/PULL_REQUEST_TEMPLATE.md 2>/dev/null || echo 'PR 설명을 작성해주세요.')" \
            --base "$BASE_BRANCH" \
            --head "$BRANCH"

          echo "✅ PR created: $BRANCH → $BASE_BRANCH"
