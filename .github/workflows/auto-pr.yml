name: Auto PR

on:
  push:
    branches:
      - 'feature/v-*'
      - 'hotfix/*'

jobs:
  create-pr:
    name: Create PR if not exists
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ github.ref_name }}"

          # feature/v-0.1 또는 feature/v-0.1_text → release/v-0.1
          # hotfix/{text} → main
          if echo "$BRANCH" | grep -qE '^feature/v-[0-9]+\.[0-9]+'; then
            VERSION=$(echo "$BRANCH" | sed 's|feature/v-||' | sed 's|_.*||')
            BASE_BRANCH="release/v-${VERSION}"
            PREFIX="feat"
          elif echo "$BRANCH" | grep -qE '^hotfix/'; then
            BASE_BRANCH="main"
            PREFIX="hotfix"
          else
            echo "Unrecognized branch pattern: $BRANCH — skip"
            exit 0
          fi

          # base 브랜치가 원격에 존재하는지 확인
          if ! git ls-remote --exit-code origin "$BASE_BRANCH" > /dev/null 2>&1; then
            echo "Base branch '$BASE_BRANCH' does not exist on remote — skip"
            exit 0
          fi

          # 이미 PR이 존재하면 스킵
          EXISTING=$(gh pr list --head "$BRANCH" --base "$BASE_BRANCH" \
            --json number --jq '.[0].number' 2>/dev/null)
          if [ -n "$EXISTING" ]; then
            echo "PR already exists: #${EXISTING} — skip"
            exit 0
          fi

          # PR 제목 생성
          VERSION_LABEL=$(echo "$BRANCH" | grep -oE 'v-[0-9]+\.[0-9]+' | head -1)
          SUFFIX=$(echo "$BRANCH" | sed 's|feature/v-[0-9]*\.[0-9]*_\?||' | sed 's|hotfix/||' | sed 's|_| |g' | sed 's|-| |g')

          gh pr create \
            --title "[${PREFIX}] ${VERSION_LABEL} ${SUFFIX}" \
            --body "$(cat .github/PULL_REQUEST_TEMPLATE.md 2>/dev/null || echo 'PR 설명을 작성해주세요.')" \
            --base "$BASE_BRANCH" \
            --head "$BRANCH"

          echo "✅ PR created: $BRANCH → $BASE_BRANCH"
