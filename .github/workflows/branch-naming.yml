name: Branch Naming

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate:
    name: Branch Naming
    runs-on: ubuntu-latest

    steps:
      - name: Check branch name format
        shell: bash
        run: |
          BRANCH="${{ github.head_ref }}"
          PATTERN='^(main|release\/v[0-9]+\.[0-9]+|feature\/v[0-9]+\.[0-9]+(_[a-z0-9][a-z0-9\-]*)?|hotfix\/[a-z0-9][a-z0-9\-]*)$'

          if echo "$BRANCH" | grep -qE "$PATTERN"; then
            echo "✅ Valid branch name: $BRANCH"
          else
            echo "❌ Invalid branch name: '$BRANCH'"
            echo ""
            echo "Allowed formats:"
            echo "  main"
            echo "  release/v{major}.{minor}               e.g. release/v0.1"
            echo "  feature/v{major}.{minor}               e.g. feature/v0.1"
            echo "  feature/v{major}.{minor}_{freetext}    e.g. feature/v0.1_add-adapter"
            echo "  hotfix/{freetext}                       e.g. hotfix/fix-auth-error"
            echo ""
            echo "Rules:"
            echo "  - major/minor must be numeric"
            echo "  - freetext must be lowercase alphanumeric + hyphens"
            echo "  - freetext must start with a letter or digit (not a hyphen)"
            exit 1
          fi
