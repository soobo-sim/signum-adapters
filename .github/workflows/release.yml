name: Release

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  release:
    name: Tag & Registry & Next branches
    if: >
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/v-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 1. 버전 추출 ───────────────────────────────────────
      - name: Extract version info
        id: version
        shell: bash
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          VERSION=$(echo "$BRANCH" | sed 's|release/v-||')
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          NEXT_MINOR=$((MINOR + 1))
          NEXT_VERSION="${MAJOR}.${NEXT_MINOR}"

          echo "version=$VERSION"            >> $GITHUB_OUTPUT
          echo "tag=v-${VERSION}"            >> $GITHUB_OUTPUT
          echo "next_version=$NEXT_VERSION"  >> $GITHUB_OUTPUT
          echo "next_release=release/v-${NEXT_VERSION}" >> $GITHUB_OUTPUT
          echo "next_feature=feature/v-${NEXT_VERSION}" >> $GITHUB_OUTPUT

          echo "🏷️  Released : v-${VERSION}"
          echo "🔜 Next     : v-${NEXT_VERSION}"

      # ── 2. Git 태그 생성 ───────────────────────────────────
      - name: Create and push git tag
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git config user.email "ci@signum-adapters.bot"
          git config user.name "CI Bot"
          git tag "$TAG"
          git push origin "$TAG"
          echo "✅ Tag pushed: $TAG"

      # ── 3. Docker 이미지 빌드 + ghcr.io push ──────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to ghcr.io
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ steps.version.outputs.tag }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 4. 다음 버전 브랜치 자동 생성 ────────────────────
      - name: Create next release and feature branches
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEXT_RELEASE="${{ steps.version.outputs.next_release }}"
          NEXT_FEATURE="${{ steps.version.outputs.next_feature }}"

          git config user.email "ci@signum-adapters.bot"
          git config user.name "CI Bot"

          git fetch origin main
          git checkout main
          git pull origin main

          git checkout -b "$NEXT_RELEASE"
          git push origin "$NEXT_RELEASE"
          echo "✅ Created: $NEXT_RELEASE"

          git checkout main
          git checkout -b "$NEXT_FEATURE"
          git push origin "$NEXT_FEATURE"
          echo "✅ Created: $NEXT_FEATURE"

      # ── 5. 완료 요약 코멘트 ───────────────────────────────
      - name: Post release summary comment
        uses: actions/github-script@v7
        with:
          script: |
            const tag = "${{ steps.version.outputs.tag }}";
            const nextRelease = "${{ steps.version.outputs.next_release }}";
            const nextFeature = "${{ steps.version.outputs.next_feature }}";
            const pr = context.payload.pull_request;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: [
                `## ✅ Release complete: \`${tag}\``,
                ``,
                `| 항목 | 결과 |`,
                `|------|------|`,
                `| 태그 | \`${tag}\` |`,
                `| 이미지 | \`ghcr.io/${{ github.repository }}:${tag}\` |`,
                `| 다음 릴리즈 브랜치 | \`${nextRelease}\` |`,
                `| 다음 피처 브랜치 | \`${nextFeature}\` |`,
                ``,
                `> \`${nextFeature}\` 브랜치에서 작업 후 push하면 자동으로 PR이 생성됩니다.`,
              ].join('\n'),
            });
