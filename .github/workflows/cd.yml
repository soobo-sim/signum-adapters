name: CD

# release/v0 브랜치 push 시 자동 버전 태그 생성 + GitHub Release
# 버전 체계: v{MAJOR}.{MINOR}  (예: v0.0, v0.1, v0.2 ...)
# 시작: v0.0

on:
  push:
    branches:
      - 'release/v*'
  workflow_dispatch:

jobs:
  release:
    name: Tag & GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # 태그 push + Release 생성 권한

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Generate version tag
        id: version
        shell: bash
        run: |
          set -eo pipefail
          BRANCH="${{ github.ref_name }}"
          MAJOR=$(echo "$BRANCH" | sed 's|release/v||')

          # 원격 태그에서 현재 MAJOR의 최신 MINOR 조회
          LATEST=$(git ls-remote --tags origin "refs/tags/v${MAJOR}.*" \
            | awk -F'/' '{print $3}' | grep -v '\^{}' | sort -V | tail -1)

          if [ -z "$LATEST" ]; then
            MINOR=0
          else
            MINOR=$(echo "$LATEST" | sed "s|v${MAJOR}\.||")
            MINOR=$((MINOR + 1))
          fi

          VERSION="${MAJOR}.${MINOR}"
          TAG="v${VERSION}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "🏷️ Next tag: $TAG"

      - name: Push tag
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git config user.email "ci@signum.bot"
          git config user.name "Signum CI"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Extract CHANGELOG section
        id: changelog
        shell: bash
        run: |
          # CHANGELOG.md 에서 [Unreleased] 섹션 본문 추출
          BODY=$(awk '/^## \[Unreleased\]/{found=1; next} found && /^## \[/{exit} found{print}' CHANGELOG.md)
          if [ -z "$BODY" ]; then
            BODY="릴리스 노트가 없습니다."
          fi
          # multiline을 GitHub output에 전달
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "body<<$EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = "${{ steps.version.outputs.tag }}";
            const body = `${{ steps.changelog.outputs.body }}`;
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: tag,
              body: body,
              draft: false,
              prerelease: false,
            });
            console.log(`✅ Release ${tag} created`);
