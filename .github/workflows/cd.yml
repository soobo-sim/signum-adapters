name: CD

# Push to release/v* branch -> auto version tag + GitHub Release + ghcr.io image
# Version scheme: v{MAJOR}.{MINOR}  (e.g. v0.0, v0.1, v0.2 ...)
# Starting point: v0.0

on:
  push:
    branches:
      - 'release/v*'
  workflow_dispatch:

jobs:
  release:
    name: Tag & GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # git tag push + GitHub Release
      packages: write  # ghcr.io push

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Generate version tag
        id: version
        shell: bash
        run: |
          set -eo pipefail
          BRANCH="${{ github.ref_name }}"
          MAJOR=$(echo "$BRANCH" | sed 's|release/v||')

          # Query remote tags for the latest MINOR under this MAJOR
          LATEST=$(git ls-remote --tags origin "refs/tags/v${MAJOR}.*" \
            | awk -F'/' '{print $3}' | grep -v '\^{}' | sort -V | tail -1 || true)

          if [ -z "$LATEST" ]; then
            MINOR=0
          else
            MINOR=$(echo "$LATEST" | sed "s|v${MAJOR}\.||")
            MINOR=$((MINOR + 1))
          fi

          VERSION="${MAJOR}.${MINOR}"
          TAG="v${VERSION}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "🏷️ Next tag: $TAG"

      - name: Push tag
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git config user.email "ci@signum.bot"
          git config user.name "Signum CI"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Extract CHANGELOG section
        id: changelog
        shell: bash
        run: |
          BODY=$(awk '/^## \[Unreleased\]/{found=1; next} found && /^## \[/{exit} found{print}' CHANGELOG.md)
          if [ -z "$BODY" ]; then
            BODY="No release notes."
          fi
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "body<<$EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = "${{ steps.version.outputs.tag }}";
            const body = `${{ steps.changelog.outputs.body }}`;
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: tag,
              body: body,
              draft: false,
              prerelease: false,
            });
            console.log(`✅ Release ${tag} created`);

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to ghcr.io
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
